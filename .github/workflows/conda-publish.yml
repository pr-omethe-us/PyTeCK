name: Publish conda package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  conda:
    name: Build and publish conda package
    # Only publish from the official repository, never from forks.
    if: github.repository == 'pr-omethe-us/PyTeCK'
    runs-on: ubuntu-latest
    defaults:
      run:
        # login shell so the conda base environment is activated in each step
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      - name: Install build and upload tools
        run: conda install -n base -y conda-build anaconda-client

      - name: Build conda package
        run: conda build conda.recipe -c conda-forge --output-folder "${{ runner.temp }}/conda-bld"

      - name: Publish to anaconda.org
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda --token "$ANACONDA_TOKEN" upload \
            --user pr-omethe-us \
            "${{ runner.temp }}"/conda-bld/noarch/pyteck-*.conda
